<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>쿠팡 순수익</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0d12;--s1:#111620;--s2:#1a2030;--s3:#232b3e;
  --border:#2a3347;--text:#e8ecf4;--muted:#6b7a99;
  --accent:#ff6b35;--accent2:#e55a25;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--yellow:#f59e0b;
  --nav-h:60px;--header-h:52px;
}
html.light{
  --bg:#f0f2f7;--s1:#ffffff;--s2:#f5f7fc;--s3:#eaecf4;
  --border:#d4d9e8;--text:#0d1121;--muted:#6b7a99;
  --accent:#e8503a;--accent2:#d4432e;
  --green:#16a34a;--red:#dc2626;--blue:#2563eb;--yellow:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
#header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--s1);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:90;}
.h-logo{font-size:15px;font-weight:900;color:var(--accent);letter-spacing:-0.5px;}
.h-logo span{color:var(--muted);font-weight:400;font-size:11px;margin-left:6px;}
.h-acts{display:flex;gap:6px;align-items:center;}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--s2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s;}
.icon-btn:hover{color:var(--text);border-color:var(--muted);}
#nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--s1);border-top:1px solid var(--border);display:flex;z-index:90;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:9px;font-weight:600;border:none;background:none;font-family:inherit;transition:color .15s;padding:6px 0;}
.nav-btn .ni{font-size:20px;line-height:1;}
.nav-btn.active{color:var(--accent);}
#app{padding-top:calc(var(--header-h) + 12px);padding-bottom:calc(var(--nav-h) + 12px);padding-left:14px;padding-right:14px;max-width:900px;margin:0 auto;}
.card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:16px;}
.card-sm{padding:12px 14px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px;}
.stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.stat-val{font-size:20px;font-weight:800;letter-spacing:-1px;line-height:1;}
.stat-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sh-title{font-size:14px;font-weight:800;}
.prod-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.prod-card.open{border-color:var(--accent);}
.prod-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.prod-name{font-size:14px;font-weight:700;line-height:1.3;}
.prod-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.prod-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.ps-item{text-align:center;}
.ps-label{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;}
.ps-val{font-size:13px;font-weight:800;margin-top:2px;}
.prod-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.prod-detail.open{display:block;}
.detail-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.dtab{padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;transition:all .15s;}
.dtab.active{color:var(--accent);border-bottom-color:var(--accent);}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.btn-sm{padding:4px 9px;font-size:11px;border-radius:7px;}
.btn-full{width:100%;justify-content:center;}
.fg{margin-bottom:11px;}
.fl{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block;}
.fi{width:100%;background:var(--s2);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:9px;font-size:14px;font-family:inherit;transition:border-color .15s;}
.fi:focus{outline:none;border-color:var(--accent);}
select.fi{cursor:pointer;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.span2{grid-column:span 2;}
.help{font-size:10px;color:var(--muted);margin-top:3px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--s1);z-index:1;}
.mt{font-size:15px;font-weight:800;}
.mb{padding:16px 18px;}
.mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;}
.mf .btn{flex:1;justify-content:center;}
.close-btn{width:30px;height:30px;border-radius:50%;background:var(--s3);border:none;color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:440px;}
th{background:var(--s2);padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;}
.tg{background:rgba(34,197,94,.15);color:var(--green);}
.tr{background:rgba(239,68,68,.15);color:var(--red);}
.tb{background:rgba(59,130,246,.15);color:var(--blue);}
.ty{background:rgba(245,158,11,.15);color:var(--yellow);}
.pos{color:var(--green);}.neg{color:var(--red);}.neu{color:var(--text);}
.alert{padding:10px 13px;border-radius:9px;font-size:12px;margin-bottom:10px;}
.ai{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:var(--blue);}
.aw{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--yellow);}
.ag{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green);}
.prog{height:6px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:6px;}
.progf{height:100%;border-radius:3px;transition:width .4s;}
.sr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.sr:last-child{border-bottom:none;}
.sl{color:var(--muted);}.sv{font-weight:700;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .ei{font-size:36px;margin-bottom:8px;}
.empty-state .et{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
.preview-box{background:var(--s2);border-radius:10px;padding:12px 14px;margin-top:10px;}
.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--s2);color:var(--muted);transition:all .15s;}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:10px;font-size:13px;color:var(--muted);}
.spin{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:640px){
  .chart-grid{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .fgrid{grid-template-columns:1fr;}
  .span2{grid-column:span 1;}
  .prod-stats{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div>불러오는 중...</div>

<div id="header">
  <div class="h-logo">🚀 쿠팡 순수익 <span id="hdate"></span></div>
  <div class="h-acts">
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="테마">🌙</button>
    <button class="icon-btn" onclick="gsSave()" title="시트 저장">☁️</button>
    <button class="icon-btn" onclick="exportJSON()" title="백업">💾</button>
    <input type="file" id="impFile" accept=".json" style="display:none" onchange="importJSON(this)">
  </div>
</div>

<div id="app"></div>

<nav id="nav">
  <button class="nav-btn active" data-page="home"><span class="ni">🏠</span>홈</button>
  <button class="nav-btn" data-page="products"><span class="ni">📦</span>상품</button>
  <button class="nav-btn" data-page="costs"><span class="ni">💸</span>비용</button>
  <button class="nav-btn" data-page="analysis"><span class="ni">📊</span>분석</button>
  <button class="nav-btn" data-page="settings"><span class="ni">⚙️</span>설정</button>
</nav>

<!-- MODALS -->
<div class="overlay" id="m-product"><div class="modal"><div class="mh"><span class="mt" id="mp-title">상품 등록</span><button class="close-btn" onclick="closeModal('m-product')">×</button></div><div class="mb" id="mp-body"></div><div class="mf"><button class="btn btn-ghost" onclick="closeModal('m-product')">취소</button><button class="btn btn-primary" onclick="saveProduct()">저장</button></div></div></div>
<div class="overlay" id="m-sale"><div class="modal"><div class="mh"><span class="mt" id="ms-title">판매 입력</span><button class="close-btn" onclick="closeModal('m-sale')">×</button></div><div class="mb" id="ms-body"></div><div class="mf"><button class="btn btn-ghost" onclick="closeModal('m-sale')">취소</button><button class="btn btn-primary" onclick="saveSale()">저장</button></div></div></div>
<div class="overlay" id="m-stock"><div class="modal"><div class="mh"><span class="mt" id="mst-title">사입 입력</span><button class="close-btn" onclick="closeModal('m-stock')">×</button></div><div class="mb" id="mst-body"></div><div class="mf"><button class="btn btn-ghost" onclick="closeModal('m-stock')">취소</button><button class="btn btn-primary" onclick="saveStock()">저장</button></div></div></div>
<div class="overlay" id="m-cost"><div class="modal"><div class="mh"><span class="mt" id="mc-title">비용 추가</span><button class="close-btn" onclick="closeModal('m-cost')">×</button></div><div class="mb" id="mc-body"></div><div class="mf"><button class="btn btn-ghost" onclick="closeModal('m-cost')">취소</button><button class="btn btn-primary" onclick="saveCost()">저장</button></div></div></div>
<div class="overlay" id="m-ad"><div class="modal"><div class="mh"><span class="mt" id="mad-title">광고비 입력</span><button class="close-btn" onclick="closeModal('m-ad')">×</button></div><div class="mb" id="mad-body"></div><div class="mf"><button class="btn btn-ghost" onclick="closeModal('m-ad')">취소</button><button class="btn btn-primary" onclick="saveAd()">저장</button></div></div></div>
<div class="overlay" id="m-goal"><div class="modal"><div class="mh"><span class="mt">목표 설정</span><button class="close-btn" onclick="closeModal('m-goal')">×</button></div><div class="mb" id="mg-body"></div><div class="mf"><button class="btn btn-ghost" onclick="closeModal('m-goal')">취소</button><button class="btn btn-primary" onclick="saveGoal()">저장</button></div></div></div>

<script>
let db;
let D={products:[],sales:[],stock:[],ads:[],baseCosts:[],extraCosts:[],goals:{monthlyTarget:0,totalTarget:0,startDate:''},settings:{vatRegistered:true,cnyRate:310,marginTarget:40}};
async function initDB(){return new Promise((res,rej)=>{const r=indexedDB.open('coupang_v2',1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('kv'))e.target.result.createObjectStore('kv',{keyPath:'k'});};r.onsuccess=e=>{db=e.target.result;res();};r.onerror=rej;});}
async function dbSave(){return new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put({k:'data',v:D});tx.oncomplete=res;});}
async function dbLoad(){return new Promise(res=>{const tx=db.transaction('kv','readonly');const r=tx.objectStore('kv').get('data');r.onsuccess=e=>{if(e.target.result)D={...D,...e.target.result.v};res();};r.onerror=()=>res();});}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const fmt=n=>Math.round(n||0).toLocaleString('ko-KR');
const fmtf=(n,d=1)=>Number(n||0).toFixed(d);
const nc=n=>n>0?'pos':n<0?'neg':'neu';
const today=()=>new Date().toISOString().split('T')[0];
const getProd=id=>D.products.find(p=>p.id===id);
const getCnyRate=()=>D.settings?.cnyRate||310;
const getMarginTarget=()=>D.settings?.marginTarget||40;
const FEES={'패션의류/잡화':10.8,'뷰티/헬스':10.8,'생활/주방':10.8,'식품':10.8,'스포츠/레저':10.8,'완구/취미':10.8,'가전/디지털':6.5,'컴퓨터/주변기기':6.5,'도서/음반':8.0,'반려동물':10.8,'기타':10.8};
const EXTRA_CATS=['포장비','마케팅비','광고비','인건비','배송비','프로그램 구독료','기타'];

function unitProfit(p,sp){sp=sp||p.sellingPrice||0;const fee=sp*(p.feeRate||0)/100;const logi=(p.logisticsCost||0)+(p.deliveryCost||0);return sp-(fee+logi)*1.1-(p.purchasePrice||0);}
function calcEndRoas(p){const sp=p.sellingPrice||0;const fee=sp*(p.feeRate||0)/100;const logi=(p.logisticsCost||0)+(p.deliveryCost||0);const margin=sp-(fee+logi)*1.1-(p.purchasePrice||0);return margin>0?(sp/margin)*1.1*100:null;}
function calcCostCeiling(p,tm){const sp=p.sellingPrice||0;const fee=sp*(p.feeRate||0)/100;const logi=(p.logisticsCost||0)+(p.deliveryCost||0);return sp-(fee+logi)*1.1-sp*tm/100;}
function saleProfit(s){const p=getProd(s.productId);if(!p)return 0;const sp=s.sellingPrice||p.sellingPrice||0;const fee=sp*(p.feeRate||0)/100;const logi=(p.logisticsCost||0)+(p.deliveryCost||0);const margin=sp-(fee+logi)*1.1-(p.purchasePrice||0);return margin*((s.qty||0)-(s.returnQty||0))-(s.adCost||0);}
function saleRevenue(s){const p=getProd(s.productId);if(!p)return 0;const sp=s.sellingPrice||p.sellingPrice||0;return sp*((s.qty||0)-(s.returnQty||0));}
function settleDate(s){const p=getProd(s.productId);const d=new Date(s.date);d.setDate(d.getDate()+(p?.settlementDays||14));return d;}
function stockLevel(pid){const bought=D.stock.filter(s=>s.productId===pid&&s.type!=='disposal').reduce((a,s)=>a+(s.qty||0),0);const sold=D.sales.filter(s=>s.productId===pid).reduce((a,s)=>a+(s.qty||0)-(s.returnQty||0),0);const disposed=D.stock.filter(s=>s.productId===pid&&s.type==='disposal').reduce((a,s)=>a+(s.qty||0),0);return bought-sold-disposed;}
function totalInvested(){const now=new Date();let t=0;D.baseCosts.forEach(c=>{if(c.isMonthly){const s=new Date(c.startDate||now);const mo=Math.max(1,Math.floor((now-s)/(1000*60*60*24*30))+1);t+=(c.amount||0)*mo;}else t+=(c.amount||0);});D.extraCosts.forEach(c=>t+=(c.amount||0));return t;}
function totalProfit(){return D.sales.reduce((a,s)=>a+saleProfit(s),0);}
function monthProfit(y,mo){return D.sales.filter(s=>{const d=new Date(s.date);return d.getFullYear()===y&&d.getMonth()===mo;}).reduce((a,s)=>a+saleProfit(s),0);}
function pendingSettlement(){const now=new Date();return D.sales.filter(s=>settleDate(s)>now).reduce((a,s)=>a+saleRevenue(s),0);}

let currentPage='home',openProdId=null,openProdTab={},costMode='base',editCostId=null,editProdId=null,saleProdId=null,stockProdId=null,stockEditId=null,extraCatFilter='',chartInstances={};

function navigate(page){currentPage=page;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));closeAllModals();render();}
function closeAllModals(){['m-product','m-sale','m-stock','m-cost','m-ad','m-goal'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('open');});}
function render(){const pages={home:renderHome,products:renderProducts,costs:renderCosts,analysis:renderAnalysis,settings:renderSettings};document.getElementById('app').innerHTML=pages[currentPage]();if(currentPage==='home')setTimeout(renderHomeChart,50);if(currentPage==='analysis')setTimeout(renderAnalysisCharts,50);}

function renderHome(){
  const now=new Date(),tp=totalProfit(),ti=totalInvested(),net=tp-ti;
  const mop=monthProfit(now.getFullYear(),now.getMonth()),lmp=monthProfit(now.getFullYear(),now.getMonth()-1);
  const goal=D.goals.monthlyTarget||0,pct=goal>0?Math.min(100,mop/goal*100):0;
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">이번달 순수익</div><div class="stat-val ${nc(mop)}">${mop<0?'-':''}₩${fmt(Math.abs(mop))}</div><div class="stat-sub">${now.getMonth()+1}월</div></div>
    <div class="stat-card"><div class="stat-label">누적 순수익</div><div class="stat-val ${nc(tp)}">${tp<0?'-':''}₩${fmt(Math.abs(tp))}</div><div class="stat-sub">전체 기간</div></div>
    <div class="stat-card"><div class="stat-label">정산 대기</div><div class="stat-val" style="color:var(--blue)">₩${fmt(pendingSettlement())}</div><div class="stat-sub">미입금 예정</div></div>
    <div class="stat-card"><div class="stat-label">전월 대비</div><div class="stat-val ${nc(mop-lmp)}">${mop-lmp>=0?'+':'-'}₩${fmt(Math.abs(mop-lmp))}</div><div class="stat-sub">지난달 ₩${fmt(Math.abs(lmp))}</div></div>
  </div>
  <div class="card" style="margin-bottom:12px;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;">
      <div><div class="stat-label">💀 진짜 흑자까지</div><div style="font-size:28px;font-weight:900;letter-spacing:-1.5px;" class="${nc(net)}">${net<0?'-':'+'}₩${fmt(Math.abs(net))}</div></div>
      <span class="tag ${net<0?'tr':'tg'}" style="margin-top:4px;">${net<0?'적자':'흑자'}</span>
    </div>
    <div class="sr"><span class="sl">누적 순수익</span><span class="sv ${nc(tp)}">${tp<0?'-':''}₩${fmt(Math.abs(tp))}</span></div>
    <div class="sr"><span class="sl">총 투자비용</span><span class="sv neg">-₩${fmt(ti)}</span></div>

function toggleProd(pid){openProdId=openProdId===pid?null:pid;if(!openProdTab[pid])openProdTab[pid]='sales';render();}
function switchProdTab(pid,tab){
  openProdTab[pid]=tab;
  document.querySelectorAll(`#pd-tabs-${pid} .dtab`).forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  const c=document.getElementById(`pd-content-${pid}`);
  if(c)c.innerHTML=renderProdDetailContent(getProd(pid),tab);
}
function renderProdDetail(p){
  const tab=openProdTab[p.id]||'sales';
  return `<div class="detail-tabs" id="pd-tabs-${p.id}">
    <button class="dtab ${tab==='sales'?'active':''}" data-tab="sales" onclick="switchProdTab('${p.id}','sales')">📋 판매내역</button>
    <button class="dtab ${tab==='stock'?'active':''}" data-tab="stock" onclick="switchProdTab('${p.id}','stock')">🏭 재고관리</button>
    <button class="dtab ${tab==='ads'?'active':''}" data-tab="ads" onclick="switchProdTab('${p.id}','ads')">📣 광고</button>

    <button class="dtab ${tab==='info'?'active':''}" data-tab="info" onclick="switchProdTab('${p.id}','info')">📊 상세정보</button>
  </div>
  <div id="pd-content-${p.id}">${renderProdDetailContent(p,tab)}</div>`;
}
function renderProdDetailContent(p,tab){
  if(tab==='sales')return renderProdSales(p);
  if(tab==='stock')return renderProdStock(p);
  if(tab==='ads')return renderProdAds(p);
  if(tab==='settle')return renderProdSettle(p);
  if(tab==='info')return renderProdInfo(p);
  return '';
}
function renderProdSales(p){
  const sales=D.sales.filter(s=>s.productId===p.id).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,50);
  // 최근 8주 주간 데이터
  const now=new Date(),wLabels=[],wProfit=[],wQty=[];
  for(let i=7;i>=0;i--){
    const end=new Date(now);end.setDate(end.getDate()-i*7);
    const start=new Date(end);start.setDate(start.getDate()-6);
    const ws=D.sales.filter(s=>s.productId===p.id&&new Date(s.date)>=start&&new Date(s.date)<=end);
    wLabels.push(`${start.getMonth()+1}/${start.getDate()}`);
    wProfit.push(ws.reduce((a,s)=>a+saleProfit(s),0));
    wQty.push(ws.reduce((a,s)=>a+(s.qty||0)-(s.returnQty||0),0));
  }
  const chartId=`ch-sales-${p.id}`;
  setTimeout(()=>{
    makeChart(chartId,'bar',wLabels,wProfit,wProfit.map(v=>v>=0?'rgba(34,197,94,.7)':'rgba(239,68,68,.7)'));

  return `
  <div class="card card-sm" style="margin-bottom:12px;">
    <div class="stat-label" style="margin-bottom:8px;">주간 순수익 추이 (최근 8주)</div>

  </div>

    <thead><tr><th>날짜</th><th>판매가</th><th>판매</th><th>반품</th><th>광고비</th><th>ROAS</th><th>순수익</th><th></th></tr></thead>
    <tbody>${sales.map(s=>{const prof=saleProfit(s);const roas=s.adCost>0?((s.adSales||0)/s.adCost*100).toFixed(0)+'%':'-';return `<tr><td>${s.date}</td><td>₩${fmt(s.sellingPrice||p.sellingPrice)}</td><td>${s.qty}</td><td>${s.returnQty||0}</td><td>${s.adCost?'₩'+fmt(s.adCost):'-'}</td><td>${roas}</td><td class="${nc(prof)}">${prof<0?'-':''}₩${fmt(Math.abs(prof))}</td><td><button class="btn btn-danger btn-sm" onclick="delSale('${s.id}')">삭제</button></td></tr>`;}).join('')}</tbody>
  </table></div>`}`;
}

function renderProdAds(p){
  const pads=D.ads.filter(a=>a.productId===p.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalAdCost=pads.reduce((a,x)=>a+(x.cost||0),0);
  const totalAdSales=pads.reduce((a,x)=>a+(x.sales||0),0);
  const totalAdClicks=pads.reduce((a,x)=>a+(x.clicks||0),0);
  const avgRoas=totalAdCost>0?(totalAdSales/totalAdCost*100):0;
  const avgCpc=totalAdClicks>0?(totalAdCost/totalAdClicks):0;
  // 최근 30일 일별 차트
  const now=new Date(),dLabels=[],dCost=[],dSales=[];
  for(let i=29;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    const da=pads.find(a=>a.date===ds);
    dLabels.push(`${d.getMonth()+1}/${d.getDate()}`);
    dCost.push(da?.cost||0);
    dSales.push(da?.sales||0);
  }
  const chartId=`ch-ads-${p.id}`;
  setTimeout(()=>{
    const el=document.getElementById(chartId);if(!el)return;
    if(chartInstances[chartId])chartInstances[chartId].destroy();
    chartInstances[chartId]=new Chart(el,{
      type:'bar',
      data:{labels:dLabels,datasets:[
        {label:'광고비',data:dCost,backgroundColor:'rgba(239,68,68,.6)',borderRadius:3},
        {label:'광고매출',data:dSales,backgroundColor:'rgba(59,130,246,.5)',borderRadius:3}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:'#6b7a99',font:{size:10},boxWidth:10}}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#6b7a99',font:{size:9},maxRotation:0,maxTicksLimit:10}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#6b7a99',font:{size:9},callback:v=>'₩'+fmt(v)}}}}
    });
  },50);
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
    <div class="card card-sm"><div class="stat-label">총 광고비</div><div style="font-size:16px;font-weight:800;color:var(--red);">₩${fmt(totalAdCost)}</div></div>
    <div class="card card-sm"><div class="stat-label">총 광고매출</div><div style="font-size:16px;font-weight:800;color:var(--blue);">₩${fmt(totalAdSales)}</div></div>
    <div class="card card-sm"><div class="stat-label">평균 ROAS</div><div style="font-size:16px;font-weight:800;color:${avgRoas>=100?'var(--green)':'var(--red)'};">${fmtf(avgRoas,0)}%</div></div>
    <div class="card card-sm"><div class="stat-label">평균 CPC</div><div style="font-size:16px;font-weight:800;">₩${fmt(avgCpc)}</div></div>
  </div>
  <div class="card card-sm" style="margin-bottom:12px;">
    <div class="stat-label" style="margin-bottom:8px;">최근 30일 광고비 / 광고매출</div>
    <div style="height:130px;"><canvas id="${chartId}"></canvas></div>
  </div>
  <div class="sh" style="margin-bottom:10px;">
    <div style="font-size:12px;font-weight:700;">일별 광고 기록</div>
    <button class="btn btn-primary btn-sm" onclick="openAdModal('${p.id}')">+ 광고비 입력</button>
  </div>
  ${pads.length===0?`<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px;">광고 기록이 없습니다<br><span style="font-size:10px;">매일 쿠팡 광고 보고서 기준으로 입력하세요</span></div>`:`
  <div class="tbl-wrap"><table>
    <thead><tr><th>날짜</th><th>광고비</th><th>광고매출</th><th>ROAS</th><th>클릭수</th><th>CPC</th><th>메모</th><th></th></tr></thead>
    <tbody>${pads.map(a=>{
      const roas=a.cost>0?(a.sales||0)/a.cost*100:0;
      const cpc=a.clicks>0?(a.cost||0)/a.clicks:0;
      return `<tr>
        <td>${a.date}</td>
        <td class="neg">₩${fmt(a.cost)}</td>
        <td style="color:var(--blue)">₩${fmt(a.sales)}</td>
        <td style="color:${roas>=100?'var(--green)':'var(--red)'};font-weight:700;">${fmtf(roas,0)}%</td>
        <td>${a.clicks||'-'}</td>
        <td>${cpc>0?'₩'+fmt(cpc):'-'}</td>
        <td style="color:var(--muted);font-size:11px;">${a.note||'-'}</td>
        <td><div style="display:flex;gap:4px;">
          <button class="btn btn-ghost btn-sm" onclick="openAdModal('${p.id}','${a.id}')">수정</button>
          <button class="btn btn-danger btn-sm" onclick="delAd('${a.id}')">삭제</button>
        </div></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`}`;
}

    <tbody>${history.map(s=>{const isD=s.type==='disposal';return `<tr><td>${s.date||'-'}</td><td><span class="tag ${isD?'tr':'tg'}">${isD?'폐기':'사입'}</span></td><td class="${isD?'neg':''}">${isD?'-':''}${s.qty}개</td><td style="color:var(--muted)">${s.note||'-'}</td><td><div style="display:flex;gap:4px;"><button class="btn btn-ghost btn-sm" onclick="openStockEditModal('${s.id}')">수정</button><button class="btn btn-danger btn-sm" onclick="delStock('${s.id}')">삭제</button></div></td></tr>`;}).join('')}</tbody>
  </table></div>`}`;
}
function renderProdSettle(p){
  const rows=D.sales.filter(s=>s.productId===p.id).map(s=>({s,due:settleDate(s)})).sort((a,b)=>a.due-b.due);

  return `<div class="card card-sm" style="margin-bottom:12px;"><div class="stat-label">정산 대기액</div><div style="font-size:20px;font-weight:800;color:var(--blue);">₩${fmt(pending)}</div></div>
  ${rows.length===0?`<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px;">판매 내역이 없습니다</div>`:`
  <div class="tbl-wrap"><table>
    <thead><tr><th>판매일</th><th>정산예정</th><th>D-day</th><th>예정액</th><th>상태</th></tr></thead>

}

    <div class="sr"><span class="sl">누적 순수익</span><span class="sv ${nc(ts.reduce((a,s)=>a+saleProfit(s),0))}">${ts.reduce((a,s)=>a+saleProfit(s),0)<0?'-':''}₩${fmt(Math.abs(ts.reduce((a,s)=>a+saleProfit(s),0)))}</span></div>

    <button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center;" onclick="openProdModal('${p.id}')">✏️ 수정</button>
    <button class="btn btn-danger btn-sm" style="flex:1;justify-content:center;" onclick="delProd('${p.id}')">🗑 삭제</button>
  </div>`;
}

function renderCosts(){
  const now=new Date();
  const tb=D.baseCosts.reduce((a,c)=>{if(c.isMonthly){const s=new Date(c.startDate||now);const mo=Math.max(1,Math.floor((now-s)/(1000*60*60*24*30))+1);return a+(c.amount||0)*mo;}return a+(c.amount||0);},0);
  const te=D.extraCosts.reduce((a,c)=>a+(c.amount||0),0);
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">

function renderAnalysis(){
  const now=new Date(),months=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({label:`${d.getMonth()+1}월`,y:d.getFullYear(),mo:d.getMonth()});}
  return `
  <div class="sh"><div class="sh-title">분석</div></div>
  <div class="chart-grid" style="margin-bottom:12px;">
    <div class="card"><div class="stat-label" style="margin-bottom:8px;">월별 순수익</div><div style="height:160px;"><canvas id="ch-monthly"></canvas></div></div>
    <div class="card"><div class="stat-label" style="margin-bottom:8px;">상품별 순수익</div><div style="height:160px;"><canvas id="ch-prods"></canvas></div></div>
  </div>
  <div class="card" style="margin-bottom:12px;">
    <div class="sh-title" style="margin-bottom:10px;">상품별 지표</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>상품명</th><th>마진</th><th>마진율</th><th>원가상한</th><th>엔드ROAS</th><th>총순수익</th></tr></thead>
      <tbody>${D.products.map(p=>{const up=unitProfit(p),mg=p.sellingPrice>0?up/p.sellingPrice*100:0,er=calcEndRoas(p),c=calcCostCeiling(p,getMarginTarget()),ok=(p.purchasePrice||0)<=c,prof=D.sales.filter(s=>s.productId===p.id).reduce((a,s)=>a+saleProfit(s),0);return `<tr><td><strong>${p.name}</strong></td><td class="${nc(up)}">₩${fmt(up)}</td><td class="${nc(mg)}">${fmtf(mg)}%${mg<getMarginTarget()?' ⚠️':''}</td><td class="${ok?'pos':'neg'}">₩${fmt(c)} ${ok?'✅':'❌'}</td><td style="color:var(--blue)">${er?Math.round(er)+'%':'-'}</td><td class="${nc(prof)}">${prof<0?'-':''}₩${fmt(Math.abs(prof))}</td></tr>`;}).join('')}</tbody>
    </table></div>
  </div>
  <div class="card" style="margin-bottom:12px;">
    <div class="sh-title" style="margin-bottom:10px;">월별 실적</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>월</th><th>순수익</th><th>매출</th><th>건수</th><th>목표달성</th></tr></thead>
      <tbody>${months.map(m=>{const mp=monthProfit(m.y,m.mo),rev=D.sales.filter(s=>{const d=new Date(s.date);return d.getFullYear()===m.y&&d.getMonth()===m.mo;}).reduce((a,s)=>a+saleRevenue(s),0),cnt=D.sales.filter(s=>{const d=new Date(s.date);return d.getFullYear()===m.y&&d.getMonth()===m.mo;}).length,g=D.goals.monthlyTarget||0;return `<tr><td>${m.label}</td><td class="${nc(mp)}">${mp<0?'-':''}₩${fmt(Math.abs(mp))}</td><td>₩${fmt(rev)}</td><td>${cnt}건</td><td>${g>0?fmtf(mp/g*100)+'%':'-'}</td></tr>`;}).join('')}</tbody>
    </table></div>
  </div>
  <div class="card">
    <div class="sh-title" style="margin-bottom:10px;">부가세 요약 (일반과세자)</div>
    ${(()=>{const st=D.sales.reduce((a,s)=>a+saleRevenue(s)*10/110,0),pt=D.sales.reduce((a,s)=>{const p=getProd(s.productId);if(!p)return a;return a+(p.purchasePrice||0)*((s.qty||0)-(s.returnQty||0))*10/110;},0);return `<div class="sr"><span class="sl">매출 세액</span><span class="sv neg">₩${fmt(st)}</span></div><div class="sr"><span class="sl">매입 세액 (공제)</span><span class="sv pos">₩${fmt(pt)}</span></div><div class="sr"><span class="sl">납부 세액</span><span class="sv ${nc(-(st-pt))}">${st-pt<0?'-':''}₩${fmt(Math.abs(st-pt))}</span></div>`;})()}
  </div>`;
}
function renderAnalysisCharts(){
  const now=new Date(),labels=[],data=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);labels.push(`${d.getMonth()+1}월`);data.push(monthProfit(d.getFullYear(),d.getMonth()));}
  makeChart('ch-monthly','bar',labels,data,data.map(v=>v>=0?'rgba(34,197,94,.7)':'rgba(239,68,68,.7)'));
  if(D.products.length){const pn=D.products.map(p=>p.name.slice(0,6)),pp=D.products.map(p=>D.sales.filter(s=>s.productId===p.id).reduce((a,s)=>a+saleProfit(s),0));makeChart('ch-prods','bar',pn,pp,pp.map(v=>v>=0?'rgba(59,130,246,.7)':'rgba(239,68,68,.7)'));}
}

function makeChart(id,type,labels,data,colors){
  const el=document.getElementById(id);if(!el)return;
  if(chartInstances[id])chartInstances[id].destroy();
  chartInstances[id]=new Chart(el,{type,data:{labels,datasets:[{data,backgroundColor:Array.isArray(colors)?colors:colors,borderRadius:type==='bar'?5:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#6b7a99',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#6b7a99',font:{size:10},callback:v=>'₩'+fmt(v)}}}}});
}

function openProdModal(id=null){
  editProdId=id;const p=id?getProd(id):null;
  document.getElementById('mp-title').textContent=id?'상품 수정':'상품 등록';
  document.getElementById('mp-body').innerHTML=`<div class="fgrid">
    <div class="fg span2"><label class="fl">상품명 *</label><input class="fi" id="p-name" value="${p?.name||''}" placeholder="예: 가족용 멀티 여권케이스"></div>
    <div class="fg"><label class="fl">카테고리</label><select class="fi" id="p-cat" onchange="autoFee()">${Object.keys(FEES).map(k=>`<option value="${k}" ${p?.category===k?'selected':''}>${k} (${FEES[k]}%)</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">수수료율 (%)</label><input class="fi" id="p-fee" type="number" step="0.1" value="${p?.feeRate??10.8}"></div>
    <div class="fg"><label class="fl">판매가 (원) *</label><input class="fi" id="p-sp" type="number" value="${p?.sellingPrice||''}" placeholder="18900" oninput="prevProd()"></div>
    <div class="fg"><label class="fl">위안화 원가 (¥)</label><input class="fi" id="p-cny" type="number" step="0.1" value="${p?.cnyPrice||''}" placeholder="25.5" oninput="autoCnyCalc()"><div class="help">× ${getCnyRate()}원 자동계산</div></div>
    <div class="fg"><label class="fl">사입단가 (원) *</label><input class="fi" id="p-pp" type="number" value="${p?.purchasePrice||''}" oninput="prevProd()"></div>
    <div class="fg"><label class="fl">쿠팡 사이즈</label><select class="fi" id="p-size"><option value="" ${!p?.sizeCategory?'selected':''}>미지정</option>${['극소형','소형','중형','대형','1특대형','2특대형'].map(v=>`<option value="${v}" ${p?.sizeCategory===v?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">입출고비 (원/개)</label><input class="fi" id="p-logi" type="number" value="${p?.logisticsCost||0}" oninput="prevProd()"></div>
    <div class="fg"><label class="fl">배송비 (원/개)</label><input class="fi" id="p-delivery" type="number" value="${p?.deliveryCost||0}" oninput="prevProd()"></div>
    <div class="fg"><label class="fl">정산 주기 (일)</label><input class="fi" id="p-settle" type="number" value="${p?.settlementDays||14}"></div>
    <div class="fg span2"><label class="fl">메모</label><input class="fi" id="p-note" value="${p?.note||''}" placeholder="옵션, 색상 등"></div>
  </div>
  <div class="preview-box" id="p-prev"><span style="color:var(--muted);font-size:12px;">판매가 입력 시 수익이 계산됩니다</span></div>`;
  document.getElementById('m-product').classList.add('open');prevProd();
}
function autoFee(){const cat=document.getElementById('p-cat').value;if(FEES[cat]){document.getElementById('p-fee').value=FEES[cat];prevProd();}}
function autoCnyCalc(){const cny=parseFloat(document.getElementById('p-cny')?.value)||0;if(cny>0)document.getElementById('p-pp').value=Math.round(cny*getCnyRate());prevProd();}
function prevProd(){
  const sp=parseFloat(document.getElementById('p-sp')?.value)||0,pp=parseFloat(document.getElementById('p-pp')?.value)||0;
  const fee=parseFloat(document.getElementById('p-fee')?.value)||0,logi=parseFloat(document.getElementById('p-logi')?.value)||0,delivery=parseFloat(document.getElementById('p-delivery')?.value)||0;
  const el=document.getElementById('p-prev');if(!el)return;
  if(!sp){el.innerHTML='<span style="color:var(--muted);font-size:12px;">판매가 입력 시 수익이 계산됩니다</span>';return;}
  const feeAmt=sp*fee/100,logi2=logi+delivery,coupangCost=(feeAmt+logi2)*1.1,profit=sp-coupangCost-pp,mg=sp>0?profit/sp*100:0;
  const er=profit>0?(sp/profit)*1.1*100:null,ceiling=sp-(feeAmt+logi2)*1.1-sp*(getMarginTarget()/100),ceilOk=pp<=ceiling;
  const pc=profit>=0?'var(--green)':'var(--red)';
  el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">
    <div><div style="color:var(--muted);font-size:10px;margin-bottom:2px;">쿠팡비용(VAT포함)</div><div style="font-weight:700;">₩${fmt(coupangCost)}</div></div>
    <div><div style="color:var(--muted);font-size:10px;margin-bottom:2px;">단위마진 / 마진율</div><div style="font-weight:800;color:${pc};">₩${fmt(profit)} / ${fmtf(mg)}%</div></div>
    <div><div style="color:var(--muted);font-size:10px;margin-bottom:2px;">엔드 ROAS</div><div style="font-weight:800;color:var(--blue);">${er?Math.round(er)+'%':'-'}</div></div>
    <div><div style="color:var(--muted);font-size:10px;margin-bottom:2px;">원가 상한선 ${ceilOk?'✅':'❌'}</div><div style="font-weight:700;color:${ceilOk?'var(--green)':'var(--red)'};">₩${fmt(ceiling)}</div></div>
  </div>`;
}
function saveProduct(){
  const name=document.getElementById('p-name').value.trim(),sp=parseFloat(document.getElementById('p-sp').value)||0,pp=parseFloat(document.getElementById('p-pp').value)||0;
  if(!name){alert('상품명을 입력하세요');return;}if(!sp||!pp){alert('판매가와 사입단가를 입력하세요');return;}
  const data={name,category:document.getElementById('p-cat').value,feeRate:parseFloat(document.getElementById('p-fee').value)||10.8,sellingPrice:sp,purchasePrice:pp,cnyPrice:parseFloat(document.getElementById('p-cny').value)||0,sizeCategory:document.getElementById('p-size').value,logisticsCost:parseFloat(document.getElementById('p-logi').value)||0,deliveryCost:parseFloat(document.getElementById('p-delivery').value)||0,settlementDays:parseInt(document.getElementById('p-settle').value)||14,note:document.getElementById('p-note').value.trim()};
  if(editProdId){const i=D.products.findIndex(p=>p.id===editProdId);D.products[i]={...D.products[i],...data};}else D.products.push({id:uid(),...data});
  dbSave();closeModal('m-product');render();
}
function delProd(id){if(!confirm('삭제 시 관련 판매/재고 내역도 삭제됩니다.'))return;D.products=D.products.filter(p=>p.id!==id);D.sales=D.sales.filter(s=>s.productId!==id);D.stock=D.stock.filter(s=>s.productId!==id);if(openProdId===id)openProdId=null;dbSave();render();}

function openSaleModal(pid){
  saleProdId=pid;const p=getProd(pid);
  document.getElementById('ms-title').textContent=`판매 입력 — ${p.name}`;
  document.getElementById('ms-body').innerHTML=`<div class="fgrid">
    <div class="fg"><label class="fl">날짜 *</label><input class="fi" id="s-date" type="date" value="${today()}"></div>
    <div class="fg"><label class="fl">판매가 (원)</label><input class="fi" id="s-sp" type="number" value="${p.sellingPrice||''}"><div class="help">비우면 등록가 적용</div></div>
    <div class="fg"><label class="fl">판매 수량 *</label><input class="fi" id="s-qty" type="number" min="0" value="1"></div>
    <div class="fg"><label class="fl">반품 수량</label><input class="fi" id="s-ret" type="number" min="0" value="0"></div>
    <div class="fg"><label class="fl">광고비 (원)</label><input class="fi" id="s-adcost" type="number" min="0" value="0"></div>
    <div class="fg"><label class="fl">광고 매출 (원)</label><input class="fi" id="s-adsales" type="number" min="0" value="0"><div class="help">ROAS 계산용</div></div>
    <div class="fg span2"><label class="fl">메모</label><input class="fi" id="s-note" placeholder="특이사항"></div>

function saveSale(){
  const qty=parseInt(document.getElementById('s-qty').value)||0,date=document.getElementById('s-date').value;
  if(!qty||!date){alert('날짜와 수량을 입력하세요');return;}
  D.sales.push({id:uid(),productId:saleProdId,date,qty,returnQty:parseInt(document.getElementById('s-ret').value)||0,sellingPrice:parseFloat(document.getElementById('s-sp').value)||0,adCost:parseFloat(document.getElementById('s-adcost').value)||0,adSales:parseFloat(document.getElementById('s-adsales').value)||0,note:document.getElementById('s-note').value.trim()});
  dbSave();closeModal('m-sale');render();
}
function delSale(id){if(!confirm('삭제하시겠습니까?'))return;D.sales=D.sales.filter(s=>s.id!==id);dbSave();render();}

function openStockModal(pid,type){
  stockProdId=pid;stockEditId=null;const p=getProd(pid),stk=stockLevel(pid),isD=type==='disposal';
  document.getElementById('mst-title').textContent=`${isD?'재고 폐기':'사입 입력'} — ${p.name}`;
  document.getElementById('mst-body').innerHTML=`${isD?`<div class="alert aw">현재 재고: <strong>${stk}개</strong></div>`:''}
  <div class="fg"><label class="fl">날짜 *</label><input class="fi" id="st-date" type="date" value="${today()}"></div>
  <div class="fg"><label class="fl">${isD?'폐기':'사입'} 수량 *</label><input class="fi" id="st-qty" type="number" min="1" ${isD?`max="${stk}"`:''}></div>
  <div class="fg"><label class="fl">메모</label><input class="fi" id="st-note" placeholder="${isD?'불량, 파손 등':'배치번호, 공급처 등'}"></div>
  <input type="hidden" id="st-type" value="${type}">`;
  document.getElementById('m-stock').classList.add('open');
}
function openStockEditModal(sid){
  const s=D.stock.find(x=>x.id===sid);if(!s)return;const p=getProd(s.productId),isD=s.type==='disposal';
  stockEditId=sid;stockProdId=s.productId;
  document.getElementById('mst-title').textContent=`${isD?'폐기':'사입'} 수정 — ${p?.name||''}`;
  document.getElementById('mst-body').innerHTML=`
  <div class="fg"><label class="fl">날짜 *</label><input class="fi" id="st-date" type="date" value="${s.date||''}"></div>
  <div class="fg"><label class="fl">${isD?'폐기':'사입'} 수량 *</label><input class="fi" id="st-qty" type="number" min="1" value="${s.qty||''}"></div>
  <div class="fg"><label class="fl">메모</label><input class="fi" id="st-note" value="${s.note||''}"></div>
  <input type="hidden" id="st-type" value="${s.type||'purchase'}">`;
  document.getElementById('m-stock').classList.add('open');
}
function saveStock(){
  const qty=parseInt(document.getElementById('st-qty')?.value)||0,date=document.getElementById('st-date')?.value||'',note=document.getElementById('st-note')?.value||'',type=document.getElementById('st-type')?.value||'purchase';
  if(!qty){alert('수량을 입력하세요');return;}
  if(type==='disposal'&&!stockEditId){const stk=stockLevel(stockProdId);if(qty>stk){alert(`폐기 수량(${qty}개)이 재고(${stk}개)를 초과합니다`);return;}}
  if(stockEditId){const i=D.stock.findIndex(s=>s.id===stockEditId);D.stock[i]={...D.stock[i],qty,date,note};}
  else D.stock.push({id:uid(),productId:stockProdId,qty,type,date,note});
  dbSave();closeModal('m-stock');render();
}
function delStock(sid){if(!confirm('삭제하시겠습니까?'))return;D.stock=D.stock.filter(s=>s.id!==sid);dbSave();render();}

function openCostModal(type,id=null){
  costMode=type;editCostId=id;const now=new Date();
  const c=id?(type==='base'?D.baseCosts:D.extraCosts).find(x=>x.id===id):null;
  document.getElementById('mc-title').textContent=type==='base'?(id?'기본비용 수정':'기본 투자비용 추가'):(id?'추가비용 수정':'추가 투자비용 추가');
  if(type==='base'){
    document.getElementById('mc-body').innerHTML=`<div class="fg"><label class="fl">항목명 *</label><input class="fi" id="ck-name" value="${c?.name||''}" placeholder="예: 프로그램 구독료, 대출금"></div>
    <div class="fgrid"><div class="fg"><label class="fl">금액 (원) *</label><input class="fi" id="ck-amount" type="number" value="${c?.amount||''}"></div><div class="fg"><label class="fl">유형</label><select class="fi" id="ck-monthly"><option value="1" ${c?.isMonthly?'selected':''}>월 정액</option><option value="0" ${c&&!c.isMonthly?'selected':''}>일회성</option></select></div>
    <div class="fg"><label class="fl">시작일</label><input class="fi" id="ck-start" type="date" value="${c?.startDate||''}"></div><div class="fg"><label class="fl">대출 여부</label><select class="fi" id="ck-loan"><option value="0" ${!c?.isLoan?'selected':''}>해당없음</option><option value="1" ${c?.isLoan?'selected':''}>대출금</option></select></div>
    <div class="fg span2"><label class="fl">연 이자율 (%)</label><input class="fi" id="ck-rate" type="number" step="0.1" value="${c?.interestRate||0}"></div></div>
    <div class="fg"><label class="fl">메모</label><input class="fi" id="ck-note" value="${c?.note||''}"></div>`;
  } else {
    document.getElementById('mc-body').innerHTML=`<div class="fg"><label class="fl">항목명 *</label><input class="fi" id="ck-name" value="${c?.name||''}" placeholder="예: 포장재 구매"></div>
    <div class="fgrid"><div class="fg"><label class="fl">금액 (원) *</label><input class="fi" id="ck-amount" type="number" value="${c?.amount||''}"></div><div class="fg"><label class="fl">날짜</label><input class="fi" id="ck-date" type="date" value="${c?.date||today()}"></div>
    <div class="fg"><label class="fl">카테고리</label><select class="fi" id="ck-cat">${EXTRA_CATS.map(v=>`<option value="${v}" ${c?.category===v?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">연결 상품</label><select class="fi" id="ck-prod"><option value="">없음</option>${D.products.map(p=>`<option value="${p.id}" ${c?.linkedProductId===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div></div>
    <div class="fg"><label class="fl">메모</label><input class="fi" id="ck-note" value="${c?.note||''}"></div>`;
  }
  document.getElementById('m-cost').classList.add('open');
}
function saveCost(){
  const name=document.getElementById('ck-name')?.value.trim(),amount=parseFloat(document.getElementById('ck-amount')?.value)||0;
  if(!name||!amount){alert('항목명과 금액을 입력하세요');return;}
  if(costMode==='base'){const data={name,amount,isMonthly:document.getElementById('ck-monthly').value==='1',startDate:document.getElementById('ck-start').value,isLoan:document.getElementById('ck-loan').value==='1',interestRate:parseFloat(document.getElementById('ck-rate').value)||0,note:document.getElementById('ck-note').value};if(editCostId){const i=D.baseCosts.findIndex(c=>c.id===editCostId);D.baseCosts[i]={...D.baseCosts[i],...data};}else D.baseCosts.push({id:uid(),...data});}
  else{const data={name,amount,date:document.getElementById('ck-date').value,category:document.getElementById('ck-cat').value,linkedProductId:document.getElementById('ck-prod').value||null,note:document.getElementById('ck-note').value};if(editCostId){const i=D.extraCosts.findIndex(c=>c.id===editCostId);D.extraCosts[i]={...D.extraCosts[i],...data};}else D.extraCosts.push({id:uid(),...data});}
  dbSave();closeModal('m-cost');render();
}
function delCost(type,id){if(!confirm('삭제하시겠습니까?'))return;if(type==='base')D.baseCosts=D.baseCosts.filter(c=>c.id!==id);else D.extraCosts=D.extraCosts.filter(c=>c.id!==id);dbSave();render();}

// ===== AD MODAL =====
let adProdId=null,editAdId=null;
function openAdModal(pid,aid=null){
  adProdId=pid;editAdId=aid;
  const p=getProd(pid);
  const a=aid?D.ads.find(x=>x.id===aid):null;
  document.getElementById('mad-title').textContent=`${aid?'광고 수정':'광고비 입력'} — ${p.name}`;
  document.getElementById('mad-body').innerHTML=`
  <div class="alert ai" style="margin-bottom:12px;">쿠팡 광고 보고서 기준으로 입력하세요</div>
  <div class="fgrid">
    <div class="fg span2"><label class="fl">날짜 *</label><input class="fi" id="ad-date" type="date" value="${a?.date||today()}"></div>
    <div class="fg"><label class="fl">광고비 (원) *</label><input class="fi" id="ad-cost" type="number" min="0" value="${a?.cost||''}"></div>
    <div class="fg"><label class="fl">광고 매출 (원)</label><input class="fi" id="ad-sales" type="number" min="0" value="${a?.sales||''}"></div>
    <div class="fg"><label class="fl">클릭수</label><input class="fi" id="ad-clicks" type="number" min="0" value="${a?.clicks||''}"><div class="help">CPC 자동계산용</div></div>
    <div class="fg"><label class="fl">노출수</label><input class="fi" id="ad-impressions" type="number" min="0" value="${a?.impressions||''}"></div>
    <div class="fg span2"><label class="fl">메모</label><input class="fi" id="ad-note" value="${a?.note||''}" placeholder="캠페인명, 특이사항 등"></div>
  </div>`;
  document.getElementById('m-ad').classList.add('open');
}
function saveAd(){
  const cost=parseFloat(document.getElementById('ad-cost')?.value)||0;
  const date=document.getElementById('ad-date')?.value;
  if(!cost||!date){alert('날짜와 광고비를 입력하세요');return;}
  const data={productId:adProdId,date,cost,sales:parseFloat(document.getElementById('ad-sales')?.value)||0,clicks:parseInt(document.getElementById('ad-clicks')?.value)||0,impressions:parseInt(document.getElementById('ad-impressions')?.value)||0,note:document.getElementById('ad-note')?.value||''};
  if(editAdId){const i=D.ads.findIndex(a=>a.id===editAdId);D.ads[i]={...D.ads[i],...data};}
  else D.ads.push({id:uid(),...data});
  dbSave();closeModal('m-ad');render();
}
function delAd(id){if(!confirm('삭제하시겠습니까?'))return;D.ads=D.ads.filter(a=>a.id!==id);dbSave();render();}

// ===== GOAL MODAL =====
function openGoalModal(){
  document.getElementById('mg-body').innerHTML=`<div class="fg"><label class="fl">이번달 목표 순수익 (원)</label><input class="fi" id="g-monthly" type="number" value="${D.goals.monthlyTarget||''}" placeholder="1000000"></div><div class="fg"><label class="fl">총 목표 순수익 (원)</label><input class="fi" id="g-total" type="number" value="${D.goals.totalTarget||''}" placeholder="누적 목표"></div><div class="fg"><label class="fl">사업 시작일</label><input class="fi" id="g-start" type="date" value="${D.goals.startDate||''}"></div>`;
  document.getElementById('m-goal').classList.add('open');
}
function saveGoal(){D.goals={monthlyTarget:parseFloat(document.getElementById('g-monthly').value)||0,totalTarget:parseFloat(document.getElementById('g-total').value)||0,startDate:document.getElementById('g-start').value};dbSave();closeModal('m-goal');render();}
function closeModal(id){document.getElementById(id).classList.remove('open');}

function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download=`coupang_backup_${today()}.json`;a.click();}
function importJSON(input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{try{const data=JSON.parse(e.target.result);if(!confirm('현재 데이터를 덮어씁니다.'))return;D={...D,...data};dbSave();render();alert('✅ 불러왔습니다!');}catch{alert('파일 형식이 올바르지 않습니다');}};r.readAsText(file);input.value='';}
function exportCSV(){const h=['날짜','상품명','판매가','판매','반품','매출','광고비','ROAS','순수익'];const rows=D.sales.map(s=>{const p=getProd(s.productId);const sp=s.sellingPrice||p?.sellingPrice||0;const roas=s.adCost>0?((s.adSales||0)/s.adCost*100).toFixed(1):'';return[s.date,p?.name||'',sp,s.qty,s.returnQty||0,sp*((s.qty||0)-(s.returnQty||0)),s.adCost||0,roas,saleProfit(s)];});const csv=[h,...rows].map(r=>r.join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.download=`coupang_sales_${today()}.csv`;a.click();}
function resetAll(){if(!confirm('정말 모든 데이터를 삭제하시겠습니까?'))return;D={products:[],sales:[],stock:[],baseCosts:[],extraCosts:[],goals:{monthlyTarget:0,totalTarget:0,startDate:''},settings:{vatRegistered:true,cnyRate:310,marginTarget:40}};dbSave();render();}

function saveGsUrl(){const url=document.getElementById('gs-url')?.value.trim();if(!url){alert('URL을 입력하세요');return;}if(!url.includes('script.google.com')){alert('올바른 URL이 아닙니다');return;}localStorage.setItem('gsScriptUrl',url);render();alert('✅ URL 저장됐습니다!');}
async function gsSave(){const url=localStorage.getItem('gsScriptUrl');if(!url){alert('설정에서 Apps Script URL을 입력하세요');navigate('settings');return;}try{await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(D),mode:'no-cors'});const now=new Date().toLocaleString('ko-KR');localStorage.setItem('gsLastSync',now);alert('✅ 구글 시트에 저장됐습니다!\n'+now);}catch(e){alert('❌ 저장 실패: '+e.message);}}
async function gsLoad(){const url=localStorage.getItem('gsScriptUrl');if(!url){alert('설정에서 Apps Script URL을 입력하세요');navigate('settings');return;}if(!confirm('구글 시트 데이터로 덮어씁니다.'))return;try{const res=await fetch(url+'?t='+Date.now());if(!res.ok)throw new Error('HTTP '+res.status);const text=await res.text();if(!text||text==='{}'){alert('저장된 데이터가 없습니다');return;}D={...D,...JSON.parse(text)};await dbSave();localStorage.setItem('gsLastSync',new Date().toLocaleString('ko-KR'));alert('✅ 불러왔습니다!');render();}catch(e){alert('❌ 불러오기 실패: '+e.message);}}

function saveSettings(){D.settings={...D.settings,vatRegistered:document.getElementById('vat-type').value==='1',cnyRate:parseFloat(document.getElementById('cny-rate')?.value)||310,marginTarget:parseFloat(document.getElementById('margin-target')?.value)||40};dbSave();alert('✅ 저장됐습니다.');}

function toggleTheme(){const isLight=document.documentElement.classList.toggle('light');document.getElementById('theme-btn').textContent=isLight?'🌙':'☀️';localStorage.setItem('theme',isLight?'light':'dark');Object.values(chartInstances).forEach(c=>{try{c.update();}catch(e){}});}
function applyTheme(){const s=localStorage.getItem('theme');if(s==='light'){document.documentElement.classList.add('light');document.getElementById('theme-btn').textContent='🌙';}else document.getElementById('theme-btn').textContent='☀️';}

document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
function updateDate(){const n=new Date();document.getElementById('hdate').textContent=`${n.getFullYear()}.${String(n.getMonth()+1).padStart(2,'0')}.${String(n.getDate()).padStart(2,'0')}`;}

(async()=>{
  await initDB();
  await dbLoad();
  document.getElementById('loading').style.display='none';
  applyTheme();
  updateDate();
  navigate('home');
})();
</script>
